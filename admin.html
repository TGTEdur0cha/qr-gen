<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link rel="icon" type="image/png" href="/favicon.png"/>
<title>QR Gen — Links</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--surface:#141414;--border:#2a2a2a;--accent:#c8f135;--text:#f0f0f0;--muted:#666;--red:#ff5555;--green:#4caf50}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:2rem 1rem;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(200,241,53,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(200,241,53,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.container{position:relative;z-index:1;width:100%;max-width:820px;margin:0 auto}
header{margin-bottom:2rem}
.tag{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--accent);letter-spacing:.2em;text-transform:uppercase;margin-bottom:.5rem}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;line-height:.95;letter-spacing:-.03em}
h1 span{color:var(--accent)}
.back{display:inline-block;margin-top:1.35rem;font-family:'Space Mono',monospace;font-size:.68rem;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--border);padding-bottom:2px}
.back:hover{color:var(--accent);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:1.5rem;margin-bottom:1rem}
.section-label{font-family:'Space Mono',monospace;font-size:.65rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:.75rem}
input[type=text],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:2px;color:var(--text);font-family:'Space Mono',monospace;font-size:.8rem;padding:.75rem .9rem;outline:none;transition:border-color .2s}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
button{font-family:'Syne',sans-serif;font-weight:700;border-radius:2px;cursor:pointer;transition:background .2s,transform .1s,border-color .2s,color .2s}
button:active{transform:scale(.97)}
.btn-primary{background:var(--accent);border:none;color:#0a0a0a;font-size:.85rem;padding:.8rem 1.25rem;white-space:nowrap}
.btn-primary:hover{background:#d9ff3f}
.btn-primary:disabled{background:#555;color:#888;cursor:not-allowed}
.login-row{display:flex;gap:.75rem;align-items:stretch}
.login-row input{flex:1}
.msg{font-family:'Space Mono',monospace;font-size:.7rem;margin-top:.75rem;min-height:1rem}
.msg.err{color:var(--red)}
.msg.ok{color:var(--accent)}
.msg.load{color:var(--muted)}

/* Barra de ferramentas */
.toolbar{display:flex;gap:.75rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.toolbar input{flex:1;min-width:200px}
.count{font-family:'Space Mono',monospace;font-size:.68rem;color:var(--muted);white-space:nowrap}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Space Mono',monospace;font-weight:400;font-size:.66rem;padding:.55rem .8rem}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* Lista de links */
.link-item{background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:1rem 1.1rem;margin-bottom:.6rem;transition:border-color .2s}
.link-item.dirty{border-color:var(--accent)}
.link-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
.slug{font-family:'Space Mono',monospace;font-size:.82rem;font-weight:700;color:var(--accent)}
.slug .dim{color:var(--muted);font-weight:400}
.meta{font-family:'Space Mono',monospace;font-size:.62rem;color:var(--muted);margin-left:auto;text-align:right;white-space:nowrap}
.meta b{color:var(--text);font-weight:400}
.edit-row{display:flex;gap:.5rem;align-items:stretch}
.edit-row input{flex:1;font-size:.72rem;padding:.55rem .7rem}
.btn-save{background:var(--accent);border:none;color:#0a0a0a;font-size:.7rem;padding:.55rem .9rem;white-space:nowrap;opacity:.35;pointer-events:none}
.link-item.dirty .btn-save{opacity:1;pointer-events:auto}
.btn-save.saved{background:var(--green);color:#fff;opacity:1}
.btn-copy{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Space Mono',monospace;font-weight:400;font-size:.66rem;padding:.55rem .7rem;white-space:nowrap}
.btn-copy:hover{border-color:var(--accent);color:var(--accent)}
.btn-copy.copied{border-color:var(--green);color:var(--green)}
.row-msg{font-family:'Space Mono',monospace;font-size:.62rem;margin-top:.45rem;min-height:.8rem}
.row-msg.err{color:var(--red)}
.row-msg.ok{color:var(--green)}
.empty{font-family:'Space Mono',monospace;font-size:.72rem;color:var(--muted);text-align:center;padding:2.5rem 1rem;border:1px dashed var(--border);border-radius:2px}
.hidden{display:none}
footer{margin-top:2.5rem;font-family:'Space Mono',monospace;font-size:.62rem;color:var(--border);letter-spacing:.1em;text-align:center}
@media(max-width:560px){
  .meta{margin-left:0;width:100%;text-align:left}
  .edit-row{flex-wrap:wrap}
  .edit-row input{flex:1 1 100%}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <p class="tag">// area restrita</p>
    <h1>GERENCIAR<br/><span>LINKS</span></h1>
    <a class="back" href="/">&larr; voltar pro gerador</a>
  </header>

  <!-- Login -->
  <div class="card" id="loginCard">
    <p class="section-label">Senha de acesso</p>
    <div class="login-row">
      <input type="password" id="pwInput" placeholder="digite a senha" autocomplete="current-password"/>
      <button class="btn-primary" id="loginBtn">Entrar</button>
    </div>
    <p class="msg" id="loginMsg"></p>
  </div>

  <!-- Painel -->
  <div id="panel" class="hidden">
    <div class="toolbar">
      <input type="text" id="filterInput" placeholder="filtrar por apelido ou destino..."/>
      <span class="count" id="count"></span>
      <button class="btn-ghost" id="reloadBtn">Recarregar</button>
      <button class="btn-ghost" id="logoutBtn">Sair</button>
    </div>
    <div id="list"></div>
  </div>

  <footer>qr-tgt — troque o destino sem reimprimir o QR</footer>
</div>

<script>
var PASS = '';
var LINKS = [];

try { PASS = sessionStorage.getItem('qr_admin_pw') || ''; } catch(e){}

function $(id){ return document.getElementById(id); }

function setLoginMsg(text, cls){
  var el = $('loginMsg');
  el.textContent = text || '';
  el.className = 'msg' + (cls ? ' ' + cls : '');
}

function fmtDate(ts){
  if(!ts) return 'sem data';
  var d = new Date(ts);
  var p = function(n){ return String(n).padStart(2,'0'); };
  return p(d.getDate()) + '/' + p(d.getMonth()+1) + '/' + d.getFullYear();
}

function shortBase(){
  return location.protocol + '//' + location.host + '/';
}

async function api(path, body){
  var res = await fetch(path, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-admin-password': PASS
    },
    body: JSON.stringify(body || {})
  });
  var data = {};
  try { data = await res.json(); } catch(e){}
  if(res.status === 401){
    logout('Senha incorreta ou expirada.');
    throw new Error('nao autorizado');
  }
  if(!res.ok) throw new Error(data.error || 'Erro ' + res.status);
  return data;
}

function logout(msg){
  PASS = '';
  try { sessionStorage.removeItem('qr_admin_pw'); } catch(e){}
  $('panel').classList.add('hidden');
  $('loginCard').classList.remove('hidden');
  $('pwInput').value = '';
  setLoginMsg(msg || '', msg ? 'err' : '');
}

async function login(){
  var pw = $('pwInput').value;
  if(!pw){ setLoginMsg('Digite a senha.', 'err'); return; }
  PASS = pw;
  $('loginBtn').disabled = true;
  setLoginMsg('verificando...', 'load');
  try {
    var data = await api('/api/list');
    try { sessionStorage.setItem('qr_admin_pw', PASS); } catch(e){}
    setLoginMsg('');
    $('loginCard').classList.add('hidden');
    $('panel').classList.remove('hidden');
    LINKS = data.links || [];
    render();
  } catch(e){
    if(e.message !== 'nao autorizado') setLoginMsg(e.message, 'err');
    PASS = '';
  } finally {
    $('loginBtn').disabled = false;
  }
}

async function reload(){
  $('reloadBtn').disabled = true;
  try {
    var data = await api('/api/list');
    LINKS = data.links || [];
    render();
  } catch(e){
    // logout ja tratou o 401
  } finally {
    $('reloadBtn').disabled = false;
  }
}

function render(){
  var term = ($('filterInput').value || '').trim().toLowerCase();
  var list = $('list');
  var shown = LINKS.filter(function(l){
    if(!term) return true;
    return l.slug.toLowerCase().indexOf(term) !== -1 ||
           (l.url || '').toLowerCase().indexOf(term) !== -1;
  });

  $('count').textContent = shown.length + (shown.length === 1 ? ' link' : ' links');
  list.innerHTML = '';

  if(!shown.length){
    var empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = LINKS.length
      ? 'Nenhum link bate com esse filtro.'
      : 'Nenhum link criado ainda.';
    list.appendChild(empty);
    return;
  }

  shown.forEach(function(link){
    var item = document.createElement('div');
    item.className = 'link-item';

    // cabecalho: apelido + cliques + data
    var head = document.createElement('div');
    head.className = 'link-head';

    var slug = document.createElement('span');
    slug.className = 'slug';
    slug.innerHTML = '<span class="dim">/</span>' + link.slug;
    head.appendChild(slug);

    var meta = document.createElement('span');
    meta.className = 'meta';
    meta.innerHTML = '<b>' + link.clicks + '</b> ' +
      (link.clicks === 1 ? 'acesso' : 'acessos') + ' &middot; ' + fmtDate(link.created);
    head.appendChild(meta);

    item.appendChild(head);

    // linha de edicao
    var row = document.createElement('div');
    row.className = 'edit-row';

    var input = document.createElement('input');
    input.type = 'text';
    input.value = link.url;
    input.spellcheck = false;
    row.appendChild(input);

    var copyBtn = document.createElement('button');
    copyBtn.className = 'btn-copy';
    copyBtn.textContent = 'Copiar';
    row.appendChild(copyBtn);

    var saveBtn = document.createElement('button');
    saveBtn.className = 'btn-save';
    saveBtn.textContent = 'Salvar';
    row.appendChild(saveBtn);

    item.appendChild(row);

    var rowMsg = document.createElement('p');
    rowMsg.className = 'row-msg';
    item.appendChild(rowMsg);

    // marca como alterado quando o texto difere do salvo
    input.addEventListener('input', function(){
      if(input.value.trim() !== link.url){
        item.classList.add('dirty');
      } else {
        item.classList.remove('dirty');
      }
      rowMsg.textContent = '';
      rowMsg.className = 'row-msg';
      saveBtn.textContent = 'Salvar';
      saveBtn.classList.remove('saved');
    });

    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && item.classList.contains('dirty')) save();
    });

    copyBtn.onclick = function(){
      var short = shortBase() + link.slug;
      var done = function(){
        copyBtn.textContent = '✓ Copiado';
        copyBtn.classList.add('copied');
        setTimeout(function(){
          copyBtn.textContent = 'Copiar';
          copyBtn.classList.remove('copied');
        }, 2000);
      };
      if(navigator.clipboard){
        navigator.clipboard.writeText(short).then(done).catch(function(){
          var ta = document.createElement('textarea');
          ta.value = short; document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta); done();
        });
      } else {
        var ta = document.createElement('textarea');
        ta.value = short; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); done();
      }
    };

    async function save(){
      var novo = input.value.trim();
      if(novo === link.url) return;
      saveBtn.disabled = true;
      rowMsg.textContent = 'salvando...';
      rowMsg.className = 'row-msg';
      try {
        await api('/api/update', { slug: link.slug, url: novo });
        link.url = novo;
        item.classList.remove('dirty');
        saveBtn.textContent = '✓ Salvo';
        saveBtn.classList.add('saved');
        rowMsg.textContent = 'destino atualizado — o QR impresso continua valendo';
        rowMsg.className = 'row-msg ok';
        setTimeout(function(){
          saveBtn.textContent = 'Salvar';
          saveBtn.classList.remove('saved');
          rowMsg.textContent = '';
          rowMsg.className = 'row-msg';
        }, 4000);
      } catch(e){
        if(e.message !== 'nao autorizado'){
          rowMsg.textContent = e.message;
          rowMsg.className = 'row-msg err';
        }
      } finally {
        saveBtn.disabled = false;
      }
    }

    saveBtn.onclick = save;
    list.appendChild(item);
  });
}

$('loginBtn').onclick = login;
$('pwInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') login(); });
$('filterInput').addEventListener('input', render);
$('reloadBtn').onclick = reload;
$('logoutBtn').onclick = function(){ logout(); };

// se ja tem senha guardada nesta sessao, entra direto
if(PASS){
  $('pwInput').value = PASS;
  login();
}
</script>
</body>
</html>
